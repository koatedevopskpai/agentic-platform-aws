[project]
name = "agenticops-eval"
version = "0.1.0"
description = "AgenticOps LLM Eval Platform - Evaluation, Observability & Guardrails"
requires-python = ">=3.11"
dependencies = [
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-core>=0.3.0",
    "boto3>=1.35.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

# One entry point with sub-commands: `agenticops-eval eval|generate-dataset|guard|dashboard ...`
# (the previous separate guard/dashboard scripts pointed at functions that need a parsed-args argument).
[project.scripts]
agenticops-eval = "agenticops_eval.main:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

# The modules live directly in src/, which is the package directory. Map it to a valid lowercase package name.
[tool.setuptools]
packages = ["agenticops_eval", "agenticops_eval.tests"]

[tool.setuptools.package-dir]
agenticops_eval = "src"

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]

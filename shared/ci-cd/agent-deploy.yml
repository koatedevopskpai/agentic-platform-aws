name: Deploy Agent Orchestrator

on:
  push:
    branches: [main]
    paths:
      - "01-multi-agent-orchestration/**"
      - "shared/**"
  pull_request:
    branches: [main]
    paths:
      - "01-multi-agent-orchestration/**"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: AGENTICOPS-orchestrator
  ECS_CLUSTER: AGENTICOPS-orchestrator
  ECS_SERVICE: orchestrator-svc
  CONTAINER_NAME: orchestrator

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01-multi-agent-orchestration

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest src/tests/ -v --cov=src --cov-report=term

      - name: Run type check
        run: pip install mypy && mypy src/ --strict

  deploy:
    name: Build and Deploy
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-ecr
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./01-multi-agent-orchestration
          docker push --all-tags $ECR_REGISTRY/$ECR_REPOSITORY
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy to Amazon ECS
        run: |
          aws ecs update-service --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment \
            --region $AWS_REGION

      - name: Wait for deployment stability
        run: |
          aws ecs wait services-stable --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --region $AWS_REGION

      - name: Run post-deployment smoke tests
        env:
          AGENT_API_URL: https://api.dev.AGENTICOPS.ai
        run: |
          curl -f -X POST "$AGENT_API_URL/health" || exit 1
          curl -f -X POST "$AGENT_API_URL/analyze" \
            -H "Content-Type: application/json" \
            -H "X-Client-Id: ci-test" \
            -d '{"query": "smoke test query"}' || exit 1

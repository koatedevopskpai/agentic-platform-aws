[project]
name = "agenticops-orchestrator"
version = "0.1.0"
description = "AgenticOps multi-agent orchestrator: supervisor/worker LangGraph topology with a reflection loop"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.28.0",
    "boto3>=1.35.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
agenticops-orchestrator = "agenticops_orchestrator.main:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

# The modules live directly in src/, which is the package directory. Map it to a valid lowercase package name.
[tool.setuptools]
packages = ["agenticops_orchestrator", "agenticops_orchestrator.tests"]

[tool.setuptools.package-dir]
agenticops_orchestrator = "src"

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]
